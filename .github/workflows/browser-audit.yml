name: Portfolio browser audit

on:
  push:
    branches: [main]
    paths:
      - "assets/site-support.css"
      - "assets/site-support.js"
      - "index.html"
      - "style.css"
      - "scripts/**"
      - ".github/workflows/browser-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "assets/site-support.css"
      - "assets/site-support.js"
      - "index.html"
      - "style.css"
      - "scripts/**"
      - ".github/workflows/browser-audit.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit portfolio SEO metadata and structured data
        run: node scripts/seo-audit.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser test
        run: |
          set -Eeuo pipefail
          python -m http.server 8767 --bind 127.0.0.1 >/tmp/vizitka-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8767/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-smoke.mjs
